<script>(function(){
  var DB="fotomanager",ST="kv",dbp;
  function open(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
  function tx(mode,fn){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(ST,mode);var q=fn(t.objectStore(ST));t.oncomplete=function(){res(q.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
  window.storage={
    get:function(k){return tx("readonly",function(s){return s.get(k)}).catch(function(){return localStorage.getItem(k)}).then(function(v){if(v===undefined||v===null)throw new Error("nicht gefunden");return{key:k,value:v}})},
    set:function(k,v){return tx("readwrite",function(s){return s.put(v,k)}).catch(function(){localStorage.setItem(k,v)}).then(function(){return{key:k,value:v}})}
  };
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
})();</script>

.fm *{box-sizing:border-box}
.fm{overflow-x:hidden}
.fm main{max-width:640px;margin:0 auto;padding:20px 16px 200px;overflow-x:hidden}
.fm h1,.fm h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
.fm h1{font-style:italic;font-weight:500}
.fm .title{font-size:38px;margin:6px 0 16px;line-height:1.05}
.fm h2{font-size:22px}
.fm .sect-h h2::before{content:"";display:inline-block;width:11px;height:15px;border-radius:99px 99px 2px 2px;background:var(--acc);margin-right:10px;vertical-align:-1px}
.fm .muted{color:var(--muted);font-size:14px;margin:4px 0 10px}
.fm .lead{margin:-10px 0 16px}
.fm .empty{background:var(--card);border-radius:20px;padding:18px;color:var(--muted);font-size:14px;margin:6px 0}
.fm .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.fm .bar .title{margin:0}
.fm .sect{margin:28px 0 0}
.fm .sect-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.fm .aside{font-size:13px;color:var(--muted)}
.fm .field{display:block;margin:0 0 12px;min-width:0}
.fm .flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fm .hint{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.fm input:not([type=range]):not([type=color]):not([type=checkbox]),.fm select,.fm textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;min-height:48px;box-shadow:0 0 0 1px var(--line)}
.fm textarea{resize:vertical;line-height:1.45}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-l)}
.fm button:focus-visible,.fm label:focus-within{outline:3px solid var(--acc-l);outline-offset:2px}
.fm .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fm .grid2 > *{min-width:0}
.fm input[type=date],.fm input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;text-align:left;line-height:1.2}
.fm input[type=date]::-webkit-date-and-time-value,.fm input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.fm input[type=date]::-webkit-calendar-picker-indicator,.fm input[type=time]::-webkit-calendar-picker-indicator{opacity:.6}
.fm .grid2 > select{margin-bottom:10px}
@media(max-width:420px){.fm .grid2{grid-template-columns:1fr}}
.fm .numwrap{display:flex;align-items:center;gap:6px}
.fm .numwrap em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.fm .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:var(--on-acc);border:none;border-radius:99px;padding:10px 20px;font:inherit;font-weight:650;cursor:pointer;min-height:46px;white-space:nowrap}
.fm .btn:hover{background:var(--acc-d)}
.fm .btn.small{min-height:40px;padding:7px 13px;font-size:14px;margin-top:6px;border-radius:99px}
.fm .btn.soft{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.fm .btn.soft:hover{background:var(--bg)}
.fm .btn.ghost{background:transparent;color:var(--ink);padding:10px 8px}
.fm .btn.ghost:hover{background:var(--line)}
.fm .btn.danger{color:#B23B4B}
.fm .btn.ask{background:#B23B4B;color:#fff}
.fm .icon{background:none;border:none;color:var(--muted);cursor:pointer;min-width:38px;min-height:38px;display:grid;place-items:center;border-radius:10px}
.fm .icon:hover{background:var(--line);color:#B23B4B}

.fm .seg{display:flex;gap:4px;background:var(--line);border-radius:16px;padding:4px;overflow-x:auto}
.fm .seg button{flex:1 0 auto;border:none;background:none;border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:42px}

.fm .crow input[type=color]{width:56px;height:38px;padding:0;border:none;border-radius:10px;background:none;cursor:pointer}
.fm .preview{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.fm .preview .tile{flex:0 0 60px}

.fm .tile.k{background:var(--c-k);color:var(--on-k)}
.fm .tile.thumb{background-size:cover;background-position:center;position:relative}
.fm .tile.thumb em{position:absolute;right:-4px;bottom:-4px;background:var(--c-g);color:var(--on-g);font-style:normal;font-weight:700;font-size:13px;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.fm .cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fm .cbody strong{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.fm .sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.fm .sub svg{margin-right:-5px}
.fm .cprice{font-family:var(--serif);font-weight:700;font-size:18px;white-space:nowrap}
.fm .pill{font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;white-space:nowrap}
.fm .pill.early{color:#9A5508;background:#F8E6C8}
.fm .pill.active{color:var(--acc-d);background:var(--acc-l)}
.fm .pill.done{color:var(--on-acc);background:var(--acc)}
/* Startseite */
.fm .hero{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;border:none;border-radius:34px;padding:24px 22px 20px;cursor:pointer;font:inherit;box-shadow:0 12px 30px rgba(60,40,20,.18)}
.fm .hero.plain{background:var(--card);color:var(--ink);cursor:default;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .hero-tag{font-size:13px;opacity:.85;font-weight:600}
.fm .hero-row{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.fm .hero-n{font-family:var(--serif);font-size:72px;line-height:.95;font-weight:600;letter-spacing:-.03em}
.fm .hero-u{font-family:var(--serif);font-size:26px}
.fm .hero-title{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;margin-top:6px}
.fm .hero-meta{font-size:14px;opacity:.85}
.fm .hero.plain .hero-meta{opacity:1;color:var(--muted)}
.fm .hero-prog{width:100%;font-size:13px;opacity:.9;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fm .hero-prog > span{display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.fm .hero-prog i{display:block;height:100%;background:currentColor;border-radius:9px}
.fm .hero-foot{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px}
.fm .hero-foot b{font-family:var(--serif);font-size:24px}
.fm .hero-pill{font-size:13px;font-weight:650;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.22)}
.fm .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fm .quick button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);border:none;border-radius:20px;padding:12px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;color:var(--ink);text-align:left;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.fm .quick small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fm .quick .qi{width:40px;height:46px;border-radius:99px 99px 12px 12px;align-items:end;padding-bottom:9px;display:grid;place-items:center;background:var(--ql);color:var(--q)}
.fm .quick .qp{position:absolute;top:12px;right:12px;color:var(--muted)}
.fm .stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;margin-top:8px}
.fm .stats div{background:var(--card);border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.fm .stats strong{font-family:var(--serif);font-size:21px}
.fm .stats span{font-size:12.5px;color:var(--muted);line-height:1.25}
.fm .panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.fm .pipe{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.fm .pipe i{display:block;flex-basis:0;min-width:0}
.fm .legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:14px}
.fm .legend span{display:flex;align-items:center;gap:10px}
.fm .legend i{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.fm .legend b{margin-left:auto;font-family:var(--serif);font-size:16px}
.fm .months{display:flex;align-items:flex-end;gap:6px;height:130px}
.fm .mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.fm .mbar{width:100%;border-radius:9px 9px 4px 4px}
.fm .mcol span{font-size:11px;color:var(--muted)}
.fm .mcol.now span{color:var(--ink);font-weight:800}
/* Formulare */
.fm .tog{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:none;border-radius:18px;padding:12px 14px;margin:0 0 8px;cursor:pointer;font:inherit;color:inherit;text-align:left;min-height:56px;box-shadow:0 0 0 1px var(--line)}
.fm .tog.on{box-shadow:0 0 0 2px var(--acc);background:var(--acc-l)}
.fm .tname{flex:1;font-weight:600}
.fm .tprice{font-size:14px;color:var(--muted);white-space:nowrap}
.fm .tog.on .tprice{color:var(--acc-d);font-weight:700}
.fm .switch{width:46px;height:28px;border-radius:99px;background:var(--track);position:relative;flex:0 0 46px;transition:background .18s}
.fm .switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.fm .tog.on .switch{background:var(--acc)}
.fm .tog.on .switch i{transform:translateX(18px)}
.fm .note{font-size:14px;margin:-4px 0 12px;color:var(--acc-d);font-weight:600}
.fm .note.warn{color:#9A5508}
.fm .duration{display:flex;gap:14px;align-items:center;background:var(--acc);color:var(--on-acc);border-radius:20px;padding:16px}
.fm .duration div{display:flex;flex-direction:column}
.fm .duration span{font-size:13.5px;opacity:.85}
.fm .slider{margin-top:16px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.fm .srow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.fm input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.fm .prow{display:grid;grid-template-columns:1fr 124px 38px;gap:8px;align-items:center;margin-bottom:8px}
.fm .newtype{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:-2px 0 14px;padding:12px;background:var(--acc-l);border-radius:18px}
.fm .newtype .btn{grid-column:1/-1;margin:0}
.fm .addrow{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.fm .addrow .btn{margin-top:0;min-height:48px}
.fm .ck{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.fm .cbox{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--track);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--on-acc)}
.fm .ck.done .cbox{background:var(--acc);border-color:var(--acc)}
.fm .ctext{flex:1}
.fm .ck.done .ctext{text-decoration:line-through;color:var(--muted)}
.fm .progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.fm .progress div{height:100%;background:var(--acc);transition:width .25s}
.fm .dq{margin-bottom:16px}
.fm .chips{display:flex;flex-wrap:wrap;gap:8px}
.fm .chip{display:inline-flex;align-items:center;gap:7px;border:none;background:var(--card);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px;color:inherit;box-shadow:0 0 0 1px var(--line)}
.fm .chip small{font-size:11.5px;opacity:.55}
.fm .chip.on{background:var(--acc);color:var(--on-acc);box-shadow:none}
.fm .gradebox{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .grade{font-family:var(--serif);font-size:42px;font-weight:600;width:66px;height:66px;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);border-radius:20px}
.fm .gradebox div:last-child{display:flex;flex-direction:column}
.fm .gradebox span{font-size:13px;color:var(--muted)}
.fm .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fm .gthumb{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--line)}
.fm .gthumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.fm .gx{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.fm .gadd{aspect-ratio:1;border-radius:16px;border:2px dashed var(--track);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--acc-d);font-size:12.5px;font-weight:650;cursor:pointer;text-align:center;padding:6px}
.fm .lightbox{position:fixed;inset:0;z-index:40;background:rgba(20,14,10,.88);display:grid;place-items:center;padding:20px}
.fm .lightbox img{max-width:100%;max-height:90vh;border-radius:18px}
.fm .gx.big{top:18px;right:18px;width:42px;height:42px}
.fm .limits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fm .limits div{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:8px 12px;min-height:56px}
.fm .limits b{font-family:var(--serif);font-size:20px;width:22px}
.fm .limits span{color:var(--muted);font-size:13px;white-space:nowrap}
.fm .limits input{min-height:40px!important;padding:6px 10px!important}
/* Aktionsleiste */
.fm .actionbar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:7;max-width:640px;margin:0 auto;padding:0 14px;display:flex;gap:10px;align-items:stretch}
.fm .btn.save{flex:1;min-height:58px;border-radius:99px;font-size:17px;box-shadow:0 10px 26px rgba(60,40,20,.3)}
.fm .sum{background:var(--ink);color:var(--bg);border:none;border-radius:22px;padding:8px 18px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;box-shadow:0 10px 26px rgba(60,40,20,.3);min-width:140px}
.fm .sum span{font-size:11.5px;opacity:.7}
.fm .sum strong{font-family:var(--serif);font-size:22px;line-height:1.1}
.fm .pb-lines{position:absolute;left:14px;right:14px;bottom:72px;background:var(--card);border-radius:22px;max-height:46vh;overflow:auto;padding:10px 18px;box-shadow:0 16px 40px rgba(60,40,20,.3)}
.fm .pb-lines div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.fm .pb-lines div:last-child{border-bottom:none}
/* Navigation */
.fm nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:616px;margin:0 auto;background:var(--card);border-radius:26px;display:flex;padding:6px 4px;box-shadow:0 10px 30px rgba(60,40,20,.2)}
.fm nav button{flex:1;min-width:0;background:none;border:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font:inherit;font-size:10px;letter-spacing:-.01em;color:var(--muted);cursor:pointer;min-height:56px;justify-content:center}
.fm nav button span{max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.fm nav button.on{color:var(--acc-d);font-weight:700}
.fm nav button.icononly{flex:0 0 40px}
.fm nav button.icononly svg{padding:5px 9px}
.fm nav button svg{box-sizing:content-box;padding:5px 13px;border-radius:99px 99px 12px 12px}
.fm nav button.on svg{background:var(--acc);color:var(--on-acc)}
.fm .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:0 10px 30px rgba(60,40,20,.3)}
/* Dekoration */
.fm .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fm .sprig{width:44px;height:64px;color:var(--c-j);opacity:.75;flex:0 0 44px;margin:2px 6px 0 0}
.fm .hero > *:not(svg){position:relative;z-index:1}
.fm .hero-arch{position:absolute;right:-8px;bottom:-6px;width:150px;opacity:.3;z-index:0;color:inherit;pointer-events:none}
.fm .hero.plain .hero-arch{color:var(--c-j);opacity:.3;width:120px}
.fm .hero.plain > strong,.fm .hero.plain > .hero-meta{max-width:calc(100% - 70px)}
.fm .hero.plain{min-height:150px}
.fm .karch{position:absolute;right:-12px;top:-14px;width:112px;color:var(--c-w);opacity:.16;pointer-events:none}
.fm .kcard.j .karch{color:var(--c-j)}
.fm .kcard > *:not(svg){position:relative}
.fm .lockline{display:flex;gap:8px;align-items:flex-start;background:var(--acc-l);color:var(--acc-d);border-radius:16px;padding:10px 14px;font-size:13.5px;font-weight:600;margin:0 0 14px}
.fm .lockline svg{flex:0 0 15px;margin-top:2px}
.fm .lockhint{display:flex;gap:8px;align-items:flex-start}
.fm .lockhint svg{flex:0 0 14px;margin-top:3px}
.fm .stats div:nth-child(1){background:var(--c-w-l)}
.fm .stats div:nth-child(2){background:var(--c-j-l)}
.fm .stats div:nth-child(3){background:var(--c-g-l)}
.fm .stats strong{font-size:24px}
.fm .quick .qi{width:40px}
/* Preisschutz, Karteikarte */
.fm .bar.wrap{flex-wrap:wrap}
.fm .barr{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.fm .stamp{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.fm .pricenote{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--acc-l);border-radius:18px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;border-left:5px solid var(--acc)}
.fm .pricenote strong{font-size:14.5px}
.fm .pricenote span{color:var(--muted)}
.fm .pricenote .stamp{margin:4px 0 0}
.fm .pricenote.diff{background:#FBEBD0;border-left-color:#C47A1C}
.fm .pricenote.diff span{color:#6E4710}
.fm .kcard{position:relative;overflow:hidden;background:var(--card);border-radius:30px;padding:24px 20px;box-shadow:0 12px 30px rgba(60,40,20,.14);border-top:10px solid var(--c-w)}
.fm .kcard.j{border-top-color:var(--c-j)}
.fm .khead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:650}
.fm .ktitle{font-size:28px;margin:8px 0 14px;line-height:1.1}
.fm .irow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.fm .irow span{color:var(--muted);font-size:13px;padding-top:2px}
.fm .irow b{font-weight:600}
.fm .kchips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.fm .kchips span{background:var(--c-w-l);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.fm .ktotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.fm .ktotal span{font-weight:650}
.fm .ktotal strong{font-family:var(--serif);font-size:34px;font-weight:600}
.fm .klines div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:3px 0}
.fm .knotes{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;margin:12px 0 0;white-space:pre-wrap}
.fm .kfoot{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding-top:10px;border-top:1px dashed var(--track);font-size:12px;color:var(--muted)}
.fm .kactions{margin-top:14px;display:flex;flex-direction:column;align-items:flex-start}
.fm .kactions .btn{width:100%}
/* Statistik & Ausrüstung */
.fm .yearsw{display:inline-flex;align-items:center;gap:4px}
.fm .yearsw b{font-family:var(--serif);font-size:19px;color:var(--ink);min-width:48px;text-align:center}
.fm .yearsw button{background:var(--card);border:none;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.fm .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fm .kpis div{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.fm .kpis .wide{grid-column:1/-1;background:var(--c-w);color:var(--on-w)}
.fm .kpis .wide span{color:inherit;opacity:.85}
.fm .kpis strong{font-family:var(--serif);font-size:22px}
.fm .kpis span{font-size:12.5px;color:var(--muted)}
.fm .mrows{display:flex;flex-direction:column;gap:6px}
.fm .mrow{display:grid;grid-template-columns:34px 1fr 82px;gap:10px;align-items:center;font-size:14px}
.fm .mrow .mname{color:var(--muted);font-weight:600}
.fm .mrow.now .mname{color:var(--ink);font-weight:800}
.fm .mrow b{text-align:right;font-family:var(--serif);font-size:14.5px;font-weight:600}
.fm .mtrack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--bg)}
.fm .mtrack i{display:block;height:100%}
.fm .legend.row{flex-direction:row;gap:18px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.fm .ratecard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--c-w);color:var(--on-w);border-radius:26px;padding:20px;margin-bottom:12px;box-shadow:0 12px 30px rgba(60,40,20,.18)}
.fm .ratecard > span{font-size:14px;opacity:.85;font-weight:600}
.fm .ratecard > strong{font-family:var(--serif);font-size:46px;line-height:1.05;font-weight:600}
.fm .ratecard small{opacity:.85;font-size:13px}
.fm .rlines{width:100%;margin:8px 0 4px}
.fm .rlines div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
.fm .rlines b{font-family:var(--serif);white-space:nowrap}
.fm .ratecard .btn{white-space:normal;text-align:center;width:100%;margin-top:10px;line-height:1.25}
.fm .ratecard small{line-height:1.35}
.fm .fieldlist{display:flex;flex-direction:column}
.fm .quick.two{grid-template-columns:1fr 1fr;margin:0 0 12px}
.fm .quick.two button{flex-direction:row;align-items:center}
.fm .quick.two .qi{align-items:end}
.fm .filters{margin:0 0 14px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.fm .filters .chip{flex:0 0 auto}
.fm .link{background:none;border:none;color:var(--acc-d);font:inherit;font-weight:650;font-size:14px;cursor:pointer;padding:6px 2px}
.fm .wlink{display:block;margin:14px auto 0;text-align:center}
.fm .demobanner{display:flex;align-items:center;gap:12px;background:var(--c-k-l);border-radius:20px;padding:12px 14px;margin:0 0 12px}
.fm .demobanner div{flex:1;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.fm .demobanner strong{color:var(--ink);font-size:14.5px}
.fm .demobanner .btn{margin:0;flex:0 0 auto}
.fm .profit{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;width:100%;margin:12px 0 4px}
.fm .profit div{background:rgba(255,255,255,.18);border-radius:16px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.fm .profit span{font-size:11.5px;opacity:.9;line-height:1.2}
.fm .profit b{font-family:var(--serif);font-size:18px;white-space:nowrap}
.fm .profit div.main{background:#fff;color:#2b211a}
.fm .profit div.main span{opacity:.75}
.fm .stackbar{display:flex;width:100%;height:14px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.2);margin:10px 0 8px}
.fm .stackbar i{display:block;height:100%;flex-basis:0;min-width:0}
.fm .legend2{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%;font-size:12.5px;margin-bottom:4px}
.fm .legend2 span{display:flex;align-items:center;gap:6px}
.fm .legend2 i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.fm .pagefoot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin:34px auto 0;max-width:420px;font-size:12.5px;color:var(--muted);line-height:1.4}
.fm .pagefoot small{opacity:.7;font-size:11.5px}
.fm .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.fm .grid3 > *{min-width:0}
.fm .slider.spec{margin:0 0 10px}
.fm .srow2{display:flex;align-items:center;gap:8px}
.fm .srow2 input[type=range]{flex:1;min-width:0}
.fm .step{flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:none;background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.fm .hintcard{background:var(--card);border-radius:24px;padding:18px;border-left:8px solid var(--acc);display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.fm .hintcard strong{font-family:var(--serif);font-size:20px}
.fm .hintcard span{color:var(--muted);font-size:14px}
.fm .foilrow .chip{grid-column:1/-1;justify-self:start}
.fm .machinecard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:24px;padding:12px;margin:12px 0 0;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .machinecard .tile{flex:0 0 52px}
.fm .machinecard .btn{margin:0;flex:0 0 auto}
.fm .mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fm .mbody span{font-size:12.5px;color:var(--muted);font-weight:600}
.fm .mbody strong{font-family:var(--serif);font-size:18px;line-height:1.2}
.fm .mbody small{font-size:12.5px;color:var(--muted)}
.fm .foilrow{display:grid;grid-template-columns:1fr 1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fm .foilrow .fname{grid-column:1/-1}
.fm .foilrow .icon{grid-row:2;grid-column:4}
.fm .boxcalc{display:flex;flex-direction:column;gap:2px;background:var(--c-w-l);border-radius:20px;padding:12px 14px;margin-top:4px}
.fm .boxcalc div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.fm .boxcalc b{font-family:var(--serif);font-size:16px}
.fm .boxcalc .neg b{color:#B23B4B}
.fm .rlines div.strong{border-top:2px solid rgba(255,255,255,.6);font-weight:700}
.fm .rlines div > span{min-width:0}
.fm .sum.wide{flex:1;border-radius:99px;padding:10px 22px}
.fm .gearrow{display:grid;grid-template-columns:1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fm .gearrow .gname{grid-column:1/-1}
.fm .gearrow .icon{grid-column:3;grid-row:2}
.fm .backup{display:flex;flex-direction:column;gap:8px}
.fm .backup .btn{width:100%;cursor:pointer}

/* Galerie, Skizze, Notizbuch */
.fm button.gadd{background:none;font:inherit;border:2px dashed var(--track);cursor:pointer;padding:6px}
.fm .sketch{position:fixed;inset:0;z-index:60;background:rgba(20,14,10,.62);display:grid;place-items:center;padding:12px;overflow:auto}
.fm .sketch-in{background:var(--card);border-radius:28px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.fm .sk-title{font-family:var(--serif);font-size:20px}
.fm .sketch canvas{width:100%;aspect-ratio:1;border-radius:18px;background:#fff;touch-action:none;box-shadow:0 0 0 1px var(--line);cursor:crosshair;display:block}
.fm .sk-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fm .sk-col{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.fm .sk-col.on{box-shadow:0 0 0 3px var(--acc)}
.fm .sk-sep{flex:1}
.fm .sk-size{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--line);padding:0}
.fm .sk-size i{display:block;border-radius:50%;background:var(--ink)}
.fm .sk-size.on{box-shadow:0 0 0 3px var(--acc)}
.fm .sk-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fm .sk-actions .btn{margin-top:0}
.fm .refsheet{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:18px 16px 90px}
.fm .refsheet > *{max-width:760px;margin-left:auto;margin-right:auto}
.fm .nbtabs{margin:4px 0 12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.fm .nbtabs .chip{flex:0 0 auto}
.fm .nbbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fm .nbbar .btn{margin-top:0}
.fm .nbmanage .trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fm .nbmanage{margin-bottom:12px}
.fm .entry{background:var(--card);border-radius:24px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .entry.editing{box-shadow:0 0 0 2px var(--acc)}
.fm .ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fm .ehead h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;line-height:1.25}
.fm .etext{white-space:pre-wrap;margin:6px 0 10px;font-size:15px;line-height:1.5}
.fm .egal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.fm .egal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in;display:block}
.fm .eactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.fm .eactions .btn{margin-top:0}
.fm a.btn{text-decoration:none}
.fm .seg.two{margin:4px 0 14px}
.fm .seg.two button{flex:1}
/* Produkte, Preislisten, Karteikarten-Bilder */
.fm .prow2{display:grid;grid-template-columns:1fr 38px 38px 38px;gap:8px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fm .prow2 .pname{grid-column:1/-1}
.fm .icon:disabled{opacity:.3;cursor:default}
.fm .prod{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fm .pthumb{width:64px;height:64px;border-radius:18px;background:var(--bg);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;overflow:hidden}
.fm .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fm .pfields{display:flex;flex-direction:column;gap:8px;min-width:0}
.fm .pctl{display:flex;flex-direction:column;gap:2px}
.fm .prodprev{display:flex;align-items:center;gap:12px;margin:-4px 0 12px;background:var(--card);border-radius:18px;padding:8px 12px;box-shadow:0 0 0 1px var(--line)}
.fm .prodprev img{width:64px;height:64px;object-fit:cover;border-radius:14px;display:block}
.fm .prodprev span{font-weight:650}
.fm .kimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.fm .kimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.fm .kcard.k{border-top-color:var(--c-k)}
.fm .kcard.k .karch{color:var(--c-k)}
.fm .kcard.g{border-top-color:var(--c-g)}
.fm .kcard.g .karch{color:var(--c-g)}
.fm .kcard.k .kchips span{background:var(--c-k-l)}
.fm .kcard.g .kchips span{background:var(--c-g-l)}
/* Dunkelmodus */
.fm.dark{color-scheme:dark}
.fm.dark .pill.early{background:#4A3517;color:#F2C879}
.fm.dark .note.warn{color:#F2C879}
.fm.dark .btn.danger{color:#F08A97}
.fm.dark .hero{box-shadow:0 12px 30px rgba(0,0,0,.5)}
.fm.dark .card,.fm.dark .entry,.fm.dark .accd{box-shadow:0 0 0 1px var(--line)}
/* Desktop: Seitenleiste, Spalten */
.fm .dash,.fm .dcol,.fm .cardgrid{display:block}
.fm .brand{display:none}
.fm nav button.icononly span{display:none}
.fm.wide .dash{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 36px;align-items:start}
.fm.wide .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.fm.wide .cardgrid .card{margin:0}
.fm.wide main{max-width:none;margin:0 0 0 252px;padding:40px clamp(32px,4.5vw,76px) 90px}
.fm.wide main > *{max-width:1240px;margin-left:auto;margin-right:auto}
.fm.wide.editing main{margin-left:0}
.fm.wide.editing main > *{max-width:1040px}
.fm.wide nav{left:0;top:0;bottom:0;right:auto;width:252px;max-width:none;margin:0;border-radius:0 34px 34px 0;flex-direction:column;justify-content:flex-start;padding:28px 14px;gap:4px;box-shadow:10px 0 36px rgba(60,40,20,.10)}
.fm.wide .brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.fm.wide .brand-sprig{width:30px;height:44px;color:var(--c-j)}
.fm.wide .brand strong{font-family:var(--serif);font-size:22px;display:block;font-style:italic;font-weight:500}
.fm.wide .brand small{color:var(--muted);font-size:12px}
.fm.wide nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;width:100%;padding:6px 10px;min-height:54px;font-size:15px;letter-spacing:0;border-radius:18px}
.fm.wide nav button.icononly{flex:none}
.fm.wide nav button.icononly span{display:inline}
.fm.wide nav button svg{padding:8px 12px}
.fm.wide nav button.on{background:var(--acc-l)}
.fm.wide .actionbar{left:252px;max-width:720px}
.fm.wide.editing .actionbar{left:0}
.fm.wide .editorbody > div{columns:2;column-gap:40px}
.fm.wide .editorbody > div > *{break-inside:avoid}
.fm.wide .editorbody .sect,.fm.wide .editorbody .ratecard,.fm.wide .editorbody .accd,.fm.wide .editorbody .gradebox{break-inside:avoid}
.fm.wide .settings > div:not(.seg){columns:2;column-gap:28px}
.fm.wide .settings .accd{break-inside:avoid}
.fm.wide .hero-n{font-size:96px}
.fm.wide .title{font-size:46px}
.fm.wide .stats strong{font-size:28px}
.fm.wide .refsheet{padding:30px}

.fm .lensrow{background:var(--bg);border-radius:18px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fm .lensname{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fm .lensname strong{font-family:var(--serif);font-size:18px}
.fm .lensname .btn{margin-top:0}
.fm .lensrow input{background:var(--card)}
@media (prefers-reduced-motion:reduce){.fm *{transition:none!important}}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));

</script>
</body>
</html>
