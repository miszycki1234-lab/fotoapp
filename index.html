<script>(function(){
  var DB="fotomanager",ST="kv",dbp;
  function open(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
  function tx(mode,fn){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(ST,mode);var q=fn(t.objectStore(ST));t.oncomplete=function(){res(q.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
  window.storage={
    get:function(k){return tx("readonly",function(s){return s.get(k)}).catch(function(){return localStorage.getItem(k)}).then(function(v){if(v===undefined||v===null)throw new Error("nicht gefunden");return{key:k,value:v}})},
    set:function(k,v){return tx("readwrite",function(s){return s.put(v,k)}).catch(function(){localStorage.setItem(k,v)}).then(function(){return{key:k,value:v}})}
  };
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
})();</script>

function boxCalc(m, s, v) {
    const invest = m.box + m.printer + m.extra;
    const fixedYear = invest / Math.max(m.years, 0.1) + m.runYear;
    const fixedB = fixedYear / Math.max(m.bookings, 1);
    const varB = v.prints * m.printCost + v.km * m.kmCost + v.workH * s.wage + m.misc;
    const cost = fixedB + varB;
    const gain = v.gain === undefined ? s.shop.gain : v.gain;
    const rec = Math.ceil((cost * (1 + gain / 100)) / 10) * 10;
    const contrib = v.price - varB;
    const cashYear = contrib * m.bookings - m.runYear;
    return {
        invest, fixedYear, fixedB, varB, cost, rec, profit: v.price - cost,
        breakEven: contrib > 0 ? fixedYear / contrib : Infinity,
        months: cashYear > 0 ? (invest / cashYear) * 12 : Infinity,
    };
}
const machineInfo = (id, label) => (s) => {
    const m = s.machines[id];
    return { label, big: `${eur(rate(m))} pro Stunde`, small: `${eur(m.price)} · ${nf(m.years, 0)} Jahre · ${nf(m.hrsYear, 0)} Std. pro Jahr` };
};

            const net = Math.max(0, v.price - v.sellOld);
            const per = v.income - v.costUse;
            const yearProfit = per * v.uses - v.runYear;
            const months = yearProfit > 0 ? (net / yearProfit) * 12 : Infinity;
            const usesPay = yearProfit > 0 && v.uses > 0 ? net / (yearProfit / v.uses) : Infinity;
            const need = per > 0 ? (net / Math.max(v.years, 0.1) + v.runYear) / per : Infinity;
            const total = yearProfit * v.years - net;
            const ok = isFinite(months) && months <= v.years * 12;
            return {

            Object.keys(byMat).forEach((name) => r.lines.push([`Du brauchst ${name}`, `${nf(byMat[name] / 1000, 2)} kg`]));
            const seen = new Set();
            used.forEach((u) => { if (seen.has(u.mat.id))

.fm .refsheet > *{max-width:760px;margin-left:auto;margin-right:auto}
.fm .nbtabs{margin:4px 0 12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.fm .nbtabs .chip{flex:0 0 auto}
.fm .nbbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fm .nbbar .btn{margin-top:0}
.fm .nbmanage .trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fm .nbmanage{margin-bottom:12px}
.fm .entry{background:var(--card);border-radius:24px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .entry.editing{box-shadow:0 0 0 2px var(--acc)}
.fm .ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fm .ehead h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;line-height:1.25}
.fm .etext{white-space:pre-wrap;margin:6px 0 10px;font-size:15px;line-height:1.5}
.fm .egal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.fm .egal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in;display:block}
.fm .eactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.fm .eactions .btn{margin-top:0}
.fm a.btn{text-decoration:none}
.fm .seg.two{margin:4px 0 14px}
.fm .seg.two button{flex:1}
/* Produkte, Preislisten, Karteikarten-Bilder */
.fm .prow2{display:grid;grid-template-columns:1fr 38px 38px 38px;gap:8px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fm .prow2 .pname{grid-column:1/-1}
.fm .icon:disabled{opacity:.3;cursor:default}
.fm .prod{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fm .pthumb{width:64px;height:64px;border-radius:18px;background:var(--bg);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;overflow:hidden}
.fm .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fm .pfields{display:flex;flex-direction:column;gap:8px;min-width:0}
.fm .pctl{display:flex;flex-direction:column;gap:2px}
.fm .prodprev{display:flex;align-items:center;gap:12px;margin:-4px 0 12px;background:var(--card);border-radius:18px;padding:8px 12px;box-shadow:0 0 0 1px var(--line)}
.fm .prodprev img{width:64px;height:64px;object-fit:cover;border-radius:14px;display:block}
.fm .prodprev span{font-weight:650}
.fm .kimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.fm .kimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.fm .kcard.k{border-top-color:var(--c-k)}
.fm .kcard.k .karch{color:var(--c-k)}
.fm .kcard.g{border-top-color:var(--c-g)}
.fm .kcard.g .karch{color:var(--c-g)}
.fm .kcard.k .kchips span{background:var(--c-k-l)}
.fm .kcard.g .kchips span{background:var(--c-g-l)}
/* Dunkelmodus */
.fm.dark{color-scheme:dark}
.fm.dark .pill.early{background:#4A3517;color:#F2C879}
.fm.dark .note.warn{color:#F2C879}
.fm.dark .btn.danger{color:#F08A97}
.fm.dark .hero{box-shadow:0 12px 30px rgba(0,0,0,.5)}
.fm.dark .card,.fm.dark .entry,.fm.dark .accd{box-shadow:0 0 0 1px var(--line)}
/* Desktop: Seitenleiste, Spalten */
.fm .dash,.fm .dcol,.fm .cardgrid{display:block}
.fm .brand{display:none}
.fm nav button.icononly .nl{display:none}
.fm.wide .dash{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 36px;align-items:start}
.fm.wide .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.fm.wide .cardgrid .card{margin:0}
.fm.wide main{max-width:none;margin:0 0 0 252px;padding:40px clamp(32px,4.5vw,76px) 90px}
.fm.wide main > *{max-width:1240px;margin-left:auto;margin-right:auto}
.fm.wide.editing main{margin-left:0}
.fm.wide.editing main > *{max-width:1040px}
.fm.wide nav{left:0;top:0;bottom:0;right:auto;width:252px;max-width:none;margin:0;border-radius:0 34px 34px 0;flex-direction:column;justify-content:flex-start;padding:28px 14px;gap:4px;box-shadow:10px 0 36px rgba(60,40,20,.10)}
.fm.wide .brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.fm.wide .brand-sprig{width:30px;height:44px;color:var(--c-j)}
.fm.wide .brand strong{font-family:var(--serif);font-size:22px;display:block;font-style:italic;font-weight:500}
.fm.wide .brand small{color:var(--muted);font-size:12px}
.fm.wide nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;width:100%;padding:6px 10px;min-height:54px;font-size:15px;letter-spacing:0;border-radius:18px}
.fm.wide nav button.icononly{flex:none}
.fm.wide nav button.icononly .nl{display:inline}
.fm.wide nav button .ni,.fm.wide nav button.icononly .ni{width:44px;height:34px}
.fm.wide nav button.on{background:var(--acc-l)}
.fm.wide .actionbar{left:252px;max-width:720px}
.fm.wide.editing .actionbar{left:0}
.fm.wide .editorbody > div{columns:2;column-gap:40px}
.fm.wide .editorbody > div > *{break-inside:avoid}
.fm.wide .editorbody .sect,.fm.wide .editorbody .ratecard,.fm.wide .editorbody .accd,.fm.wide .editorbody .gradebox{break-inside:avoid}
.fm.wide .settings > div:not(.seg){columns:2;column-gap:28px}
.fm.wide .settings .accd{break-inside:avoid}
.fm.wide .hero-n{font-size:96px}
.fm.wide .title{font-size:46px}
.fm.wide .stats strong{font-size:28px}
.fm.wide .refsheet{padding:30px}

.fm .lensrow{background:var(--bg);border-radius:18px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fm .lensname{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fm .lensname strong{font-family:var(--serif);font-size:18px}
.fm .lensname .btn{margin-top:0}
.fm .lensrow input{background:var(--card)}
/* Anmeldung, Zurücksetzen, Ordner, Skizze */
.fm .authwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 40px;position:relative;overflow:hidden}
.fm .authcard{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
.fm .auth-sprig{width:52px;height:76px;color:var(--c-j)}
.fm .auth-arch{position:absolute;right:-40px;bottom:-30px;width:300px;color:var(--c-w);opacity:.14;pointer-events:none}
.fm .auth-title{font-size:44px;margin:0;text-align:center;line-height:1.05}
.fm .auth-sub{color:var(--muted);text-align:center;margin:0 0 4px}
.fm .authcard .seg{width:100%}
.fm .authform{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.fm .authform .btn.save{width:100%;position:static;margin-top:6px;box-shadow:none}
.fm .authform .link{align-self:center;margin-top:6px}
.fm .authforgot{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.fm .center{text-align:center}
.fm .autherr{color:#B23B4B;font-weight:650;min-height:22px;text-align:center;margin:0}
.fm .pindots{display:flex;gap:14px;justify-content:center;margin:8px 0 0}
.fm .pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--track);transition:background .12s}
.fm .pindots i.on{background:var(--acc);border-color:var(--acc)}
.fm .pindots.shake{animation:fmshake .35s}
@keyframes fmshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fm .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin:2px 0 4px}
.fm .pad button{width:72px;height:72px;padding:0;border-radius:50%;border:none;background:var(--card);color:var(--ink);font-family:var(--serif);font-size:27px;cursor:pointer;box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(60,40,20,.08)}
.fm .pad button:active{background:var(--acc-l)}
.fm .pad button:disabled{opacity:.4}
.fm .five{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fm .fivedots{display:flex;gap:6px;padding-left:12px}
.fm .fivedots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.fm .fivedots i.on{background:#B23B4B}
.fm .tsub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.fm .catchip{display:inline-block;background:var(--acc-l);color:var(--acc-d);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:650;margin:4px 0 0}
.fm .linked h4{font-family:var(--serif);font-size:19px;margin:22px 0 2px}
.fm .folders{margin-top:16px}
.fm .folders .egal{margin-top:10px}
.fm .sk-toolbar{margin:0}
.fm .sk-hint{margin:-4px 0 0}
.fm .sk-dim{background:var(--acc-l);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fm .sk-dimrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fm .sk-dimrow input{flex:1;min-width:110px}
.fm .sk-tools .chip{margin-left:auto}
@media (max-width:350px){.fm nav button{font-size:8.6px;letter-spacing:-.03em}.fm nav button .ni{width:34px}.fm nav button.icononly .ni{width:32px}.fm nav{left:6px;right:6px;padding:6px 2px}}
.fm .due{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.fm .ck.late .due{color:#B23B4B;font-weight:650}
.fm .fbtn{background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:0}
.fm .fristen .btn{margin-top:10px}
.fm .matrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fm .matrow .pname{grid-column:1/-1}
.fm .matctl{grid-column:1/-1;display:flex;justify-content:flex-end;gap:2px}
.fm .link.subtle{display:block;font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 2px 0}
.fm .todop{background:var(--card);border-radius:18px;margin:0 0 8px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.fm .todoh{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left;padding:10px 14px 10px 0;cursor:pointer;min-height:58px}
.fm .todobar{align-self:stretch;width:5px;border-radius:0 5px 5px 0;background:var(--track);flex:0 0 5px}
.fm .todop.w .todobar{background:var(--c-w)}
.fm .todop.j .todobar{background:var(--c-j)}
.fm .todop.k .todobar{background:var(--c-k)}
.fm .todot{flex:1;min-width:0;display:flex;flex-direction:column}
.fm .todot strong{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm .todot small{color:var(--muted);font-size:12.5px}
.fm .todon{font-size:13px;color:var(--muted);font-weight:650}
.fm .todoh svg{color:var(--muted);transition:transform .2s}
.fm .todop.open .todoh svg{transform:rotate(180deg)}
.fm .todob{padding:0 14px 8px 19px}
.fm .linkrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.fm .linkrow .tile{flex:none;width:44px;height:52px;padding-bottom:8px}
.fm .linkbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.fm .linkbody small{color:var(--muted);font-size:12.5px}
.fm .linkbody input{margin-top:4px;min-height:42px}
.fm .linknote{font-size:13.5px;background:var(--bg);border-radius:12px;padding:6px 10px;margin-top:3px}
.fm .linkside{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.fm .linkside b{font-family:var(--serif)}
.fm .linkadd{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fm .linkadd .btn{align-self:flex-start;margin-top:0}
.fm .linksum{background:var(--bg);border-radius:18px;padding:8px 14px;margin-top:12px}
.fm .linksum div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.fm .linksum div:last-child{border-bottom:none}
.fm .linksum .strong{font-weight:700}
.fm .linksum b{font-family:var(--serif)}
.fm .parts{display:flex;flex-direction:column;gap:12px}
.fm .part{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.fm .parthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fm .parthead strong{font-family:var(--serif);font-size:18px}
.fm .quickg{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}
.fm .partcost{margin:-4px 0 10px}
.fm .gx.edit{left:6px;right:auto}
.fm .sk-sel{display:flex;gap:8px;flex-wrap:wrap}
.fm .sk-sel .btn{margin-top:0}
.fm .dtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0}
.fm .dtab{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.2);color:inherit;border:none;border-radius:16px;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;min-height:50px}
.fm .dtab span{font-size:13.5px;font-weight:600}
.fm .dtab b{font-family:var(--serif);font-size:15px;white-space:nowrap}
.fm .dtab.on{background:rgba(255,255,255,.42)}
.fm .dtab:last-child:nth-child(odd){grid-column:1/-1}
.fm .dpanel{background:rgba(255,255,255,.22);border-radius:18px;padding:12px 14px;margin-top:10px}
.fm .dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid rgba(255,255,255,.5);margin-bottom:4px}
.fm .dhead strong{font-size:15px}
.fm .dhead b{font-family:var(--serif);font-size:18px}
.fm .drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.25);font-size:14px;line-height:1.35}
.fm .drow:last-child{border-bottom:none}
.fm .drow b{font-family:var(--serif);white-space:nowrap}
.fm .dempty{margin:4px 0;font-size:13.5px;opacity:.85}
.fm .kparts{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.fm .kparts-h{font-family:var(--serif);font-size:20px;margin:0 2px}
.fm .kpart{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.05)}
.fm .kpart-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fm .kpart-h strong{font-family:var(--serif);font-size:19px}
.fm .kpart-n{width:30px;height:30px;border-radius:50%;background:var(--c-k);color:var(--on-k);display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 30px}
.fm .kpart .krows{margin-top:6px}
.fm .kpart .knotes{margin:10px 0 0}
.fm .kpart .kimgs{padding:10px 0 0;border-top:none}
@media (prefers-reduced-motion:reduce){.fm *{transition:none!important}}
`;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
